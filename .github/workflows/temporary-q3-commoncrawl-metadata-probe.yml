name: Temporary Q3 Common Crawl Metadata Probe
on:
  pull_request:
    paths:
      - 'temporary-proof/resume-instrument/q3_commoncrawl_metadata_probe.py'
      - '.github/workflows/temporary-q3-commoncrawl-metadata-probe.yml'
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - run: python -m pip install pyarrow==21.0.0
      - name: Run bounded aggregate probe
        shell: bash
        run: |
          set -o pipefail
          python temporary-proof/resume-instrument/q3_commoncrawl_metadata_probe.py | tee "$RUNNER_TEMP/q3-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-commoncrawl-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/q3-receipt.json
          if-no-files-found: warn
