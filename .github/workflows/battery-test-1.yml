name: Battery Test 1 CALCE CS2 Run-to-Failure

on:
  push:
    branches:
      - battery-test-1-calce-cs2
    paths:
      - 'battery_test_1/run_battery_test_1.py'
      - 'battery_test_1/preflight_and_run.py'
      - '.github/workflows/battery-test-1.yml'
  workflow_dispatch:

concurrency:
  group: battery-test-1-calce-cs2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-battery-test-1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated battery branch
        uses: actions/checkout@v4
        with:
          ref: battery-test-1-calce-cs2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests scikit-learn openpyxl xlrd

      - name: Preflight and execute battery test
        run: python battery_test_1/preflight_and_run.py

      - name: Persist compact empirical return
        if: success()
        run: |
          mkdir -p battery_test_1/results
          cp battery_test_1/outputs/metrics.json battery_test_1/results/
          cp battery_test_1/outputs/run_receipt.json battery_test_1/results/
          cp battery_test_1/outputs/source_registry.json battery_test_1/results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battery_test_1/results
          if ! git diff --cached --quiet; then
            git commit -m "Store Battery Test 1 empirical return [skip ci]"
            git push origin HEAD:battery-test-1-calce-cs2
          fi

      - name: Upload complete result package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BATTERY_TEST_1_CALCE_CS2_RESULT_PACKAGE
          path: battery_test_1/outputs/
          if-no-files-found: warn
          retention-days: 90
