name: Battery Test 1 CALCE Schema Inspection

on:
  push:
    branches:
      - battery-test-1-calce-cs2
    paths:
      - 'battery_test_1/inspect_calce_schema.py'
      - '.github/workflows/battery-test-1.yml'
  workflow_dispatch:

concurrency:
  group: battery-test-1-calce-schema-inspection
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect-calce-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated battery branch
        uses: actions/checkout@v4
        with:
          ref: battery-test-1-calce-cs2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema-inspection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl xlrd

      - name: Inspect one canonical CALCE archive
        run: python battery_test_1/inspect_calce_schema.py

      - name: Persist schema manifest
        if: success()
        run: |
          mkdir -p battery_test_1/schema_results
          cp battery_test_1/schema_inspection/results/schema_manifest.json battery_test_1/schema_results/
          cp battery_test_1/schema_inspection/results/schema_report.txt battery_test_1/schema_results/
          cp battery_test_1/schema_inspection/results/schema_receipt.json battery_test_1/schema_results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battery_test_1/schema_results
          if ! git diff --cached --quiet; then
            git commit -m "Store CALCE CS2_33 schema manifest [skip ci]"
            git push origin HEAD:battery-test-1-calce-cs2
          fi

      - name: Upload schema package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BATTERY_TEST_1_CALCE_SCHEMA_INSPECTION
          path: battery_test_1/schema_inspection/results/
          if-no-files-found: warn
          retention-days: 90
