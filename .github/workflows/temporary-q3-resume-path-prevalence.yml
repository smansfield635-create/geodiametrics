name: Temporary Q3 Resume Path Prevalence
on:
  pull_request:
    paths:
      - 'temporary-proof/resume-instrument/q3_resume_path_prevalence.py'
      - '.github/workflows/temporary-q3-resume-path-prevalence.yml'
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.15'}
      - run: python -m pip install pyarrow==21.0.0
      - name: Count aggregate prevalence
        shell: bash
        run: |
          set -o pipefail
          python temporary-proof/resume-instrument/q3_resume_path_prevalence.py | tee "$RUNNER_TEMP/q3-prevalence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-resume-prevalence-${{ github.run_id }}
          path: ${{ runner.temp }}/q3-prevalence.json
          if-no-files-found: warn
